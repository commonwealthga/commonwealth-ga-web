<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- The header sigil on a transparent field: an ember hexagon ring around a
	     red core. No plate behind it - a dark square in a browser tab's own
	     chrome reads as a broken image. Stroke thickened for 16px tabs. -->
	<polygon points="32,8 51.5,19.25 51.5,44.75 32,56 12.5,44.75 12.5,19.25"
		fill="none" stroke="#ff7a18" stroke-width="5" stroke-linejoin="round" />
	<polygon points="32,23 39.79,27.5 39.79,36.5 32,41 24.21,36.5 24.21,27.5"
		fill="#e0391c" />
</svg>
